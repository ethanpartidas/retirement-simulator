# Retirement Simulation Configuration

[person]
current_age = 25
end_age     = 95
current_nw  = 150_000

[cashflow]
monthly_savings_today  = 4_000
retirement_spend_today = 4_000

[market]
stock_mu_nom   = 0.10
stock_vol      = 0.15
bond_mu_nom    = 0.045
bond_vol       = 0.05
inflation_rate = 0.03

# Post-retirement bond volatility.
# Use a lower value (e.g. 0.01) to model a bond ladder / annuity floor.
# Defaults to bond_vol if omitted.
retirement_bond_vol = 0.01

[simulation]
iterations        = 10_000
target_percentile = 0.95
num_quantiles     = 50

# ── Mode ────────────────────────────────────────────────────────────────────
# "earliest_retirement"
#     Optimize allocation to retire as early as possible at the target
#     percentile.  The DP stores the predicted retirement age at each
#     (age, wealth) state.
#
# "max_wealth"
#     Assume a fixed retirement age and optimize allocation to maximise
#     inflation-adjusted net worth at that age.  The DP stores predicted
#     wealth (in today's dollars) at each (age, wealth) state.
# ────────────────────────────────────────────────────────────────────────────
mode = "earliest_retirement"

# Only used when mode = "max_wealth":
fixed_retirement_age = 55
